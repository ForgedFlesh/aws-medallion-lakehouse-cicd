name: medallion_lakehouse
version: 1.0.0
config-version: 2

profile: medallion_lakehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  medallion_lakehouse:

    staging:
      +materialized: view

    marts:

      core:
        +materialized: incremental
        +table_type: iceberg
        +format: parquet
        +incremental_strategy: merge

      reporting:
        +materialized: table
        +format: parquet

vars:
  processing_date: ""
